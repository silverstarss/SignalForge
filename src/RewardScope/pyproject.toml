[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rewardscope"
version = "0.0.0"
description = "Lightweight rollout diagnostics for RLVR experiments."
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6",
]

[project.optional-dependencies]
analysis = [
    "matplotlib>=3.8",
]
data = [
    "datasets>=3",
]
model = [
    "transformers>=5.14,<6",
    "accelerate>=1.0",
]
math = [
    "math-verify[antlr4_13_2]==0.9.0",
]
modelscope = [
    "modelscope>=1.13.2",
]
dev = [
    "pytest>=8",
    "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
